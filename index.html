<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf2e7">
<meta name="description" content="The BreedLoveXXperience — LaShanna & Rodney. Our Love. Our Way. Save the date: October 10, 2027.">
<title>The BreedLoveXXperience | Save the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#642334;--orange:#C55A11;--gold:#bd9863;--ink:#503a37;--paper:#fff9f0}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 50% 35%,#fffdf8 0%,#f8ecdd 100%)}
.site{isolation:isolate;position:relative;overflow:hidden;min-height:100svh;padding:clamp(20px,3.2vw,45px);display:flex;align-items:center;justify-content:center}
.corner{position:absolute;z-index:0;pointer-events:none;object-fit:contain}
.corner.top{right:0;top:0;width:clamp(190px,26vw,370px)}
.corner.bottom{left:0;bottom:0;width:clamp(260px,41vw,680px)}
.frame{width:min(100%,1460px);position:relative;z-index:1;border:1px solid rgba(171,124,77,.62);outline:1px solid rgba(171,124,77,.35);outline-offset:-10px;padding:clamp(34px,5vw,65px) clamp(20px,5vw,72px);background:rgba(255,251,244,.08)}
header{text-align:center;position:relative;z-index:2}
h1{color:var(--wine);font:400 clamp(3.15rem,7.1vw,7.2rem)/1.08 'Great Vibes',cursive;margin:0;overflow-wrap:anywhere}
.couple{color:var(--orange);font:400 clamp(2rem,3.6vw,3.7rem)/1.1 'Great Vibes',cursive;margin:5px 0 18px}
.ornament{display:flex;gap:12px;align-items:center;justify-content:center;color:var(--gold);font-size:20px}.ornament::before,.ornament::after{content:"";height:1px;width:100px;max-width:16vw;background:var(--gold)}
.content{display:grid;grid-template-columns:1.09fr .91fr;align-items:center;gap:clamp(28px,4vw,70px);margin:28px auto 0;max-width:1210px}
.photo{margin:0;min-width:0}.photo img{width:100%;height:auto;display:block;border:9px solid #fff7ec;outline:1px solid #d4b88e;box-shadow:0 12px 30px rgba(72,43,24,.12)}
.info{text-align:center;min-width:0}.theme{font:italic 500 clamp(1.5rem,2.4vw,2.15rem) 'Cormorant Garamond',serif;color:var(--wine);margin:0 0 12px}.rule{height:1px;background:var(--gold);width:110px;margin:0 auto 15px}
.date{font:400 clamp(2.2rem,4.2vw,4.1rem)/1.04 'Cormorant Garamond',serif;color:var(--wine);margin:0 0 14px}
.details{font-size:.76rem;letter-spacing:.3em;color:var(--orange);font-weight:600;margin:0 0 19px}.sub{font:italic 400 clamp(1.15rem,1.8vw,1.5rem) 'Cormorant Garamond',serif;color:var(--wine);margin:0 0 20px}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));max-width:550px;margin:auto}.unit{padding:5px 3px;min-width:0}.unit:not(:last-child){border-right:1px solid var(--gold)}.num{display:block;font:400 clamp(2rem,3.2vw,3.1rem)/1 'Cormorant Garamond',serif;font-variant-numeric:tabular-nums;color:var(--wine)}.unit small{display:block;font-size:.59rem;letter-spacing:.13em;color:var(--orange);margin-top:8px;font-weight:600}
.save{font:400 clamp(1.5rem,2.5vw,2.55rem) 'Cormorant Garamond',serif;color:var(--wine);letter-spacing:.26em;text-align:center;margin:40px 0 0}.save::before{content:"◆";color:var(--gold);display:block;font-size:15px;letter-spacing:0;margin-bottom:13px}
@media(max-width:800px){.site{padding:14px}.frame{padding:55px 18px 35px}.content{grid-template-columns:1fr;gap:36px;max-width:570px}.corner.top{width:190px}.corner.bottom{width:260px}h1{font-size:clamp(3.3rem,11vw,5.5rem)}.save{margin-top:38px}.details{letter-spacing:.2em}}
@media(max-width:400px){.frame{padding:54px 12px 28px}h1{font-size:3.1rem}.unit small{font-size:.47rem}.num{font-size:1.9rem}.corner.top{width:150px}.corner.bottom{width:190px}}
</style>
</head>
<body>
<div class="site">
<img class="corner top" src="assets/floral-top.png" alt="" aria-hidden="true">
<img class="corner bottom" src="assets/floral-bottom.png" alt="" aria-hidden="true">
<div class="frame">
<header><h1>The BreedLoveXXperience</h1><p class="couple">LaShanna &amp; Rodney</p><div class="ornament" aria-hidden="true">◆</div></header>
<main class="content">
<figure class="photo"><img src="assets/proposal.jpeg" alt="Rodney proposing to LaShanna in Mexico City, surrounded by an applauding crowd" fetchpriority="high"></figure>
<section class="info" aria-label="Wedding announcement and countdown">
<p class="theme">Our Love. Our Way.</p><div class="rule" aria-hidden="true"></div>
<p class="date">October 10, 2027</p>
<p class="details">DETAILS COMING SOON</p>
<p class="sub">Counting down to forever</p>
<div class="countdown" role="timer" aria-label="Time remaining to the wedding">
<div class="unit"><span id="days" class="num">—</span><small>DAYS</small></div>
<div class="unit"><span id="hours" class="num">—</span><small>HOURS</small></div>
<div class="unit"><span id="minutes" class="num">—</span><small>MINUTES</small></div>
<div class="unit"><span id="seconds" class="num">—</span><small>SECONDS</small></div>
</div></section></main>
<p class="save">SAVE THE DATE</p>
</div></div>
<script>
// Midnight Eastern on the wedding date; update to the ceremony time once confirmed.
const weddingTime=new Date('2027-10-10T00:00:00-04:00').getTime();
const ids=['days','hours','minutes','seconds'];
function updateCountdown(){const d=Math.max(0,weddingTime-Date.now());const parts=[Math.floor(d/86400000),Math.floor(d/3600000)%24,Math.floor(d/60000)%60,Math.floor(d/1000)%60];parts.forEach((n,i)=>document.getElementById(ids[i]).textContent=i===0?String(n):String(n).padStart(2,'0'));}
updateCountdown();setInterval(updateCountdown,1000);
</script>
</body>
</html>
